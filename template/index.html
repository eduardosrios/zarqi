<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Zarqi architecture and design studio.">
    <title>Zarqi Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header class="hero" id="home">
        <nav class="navbar navbar-expand-lg navbar-dark hero__nav" aria-label="Primary navigation">
            <div class="container-fluid p-0">
                <a class="navbar-brand hero__brand" href="#home" aria-label="Zarqi home">ZARQI</a>

                <button
                    class="navbar-toggler hero__menu-button"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#primaryNavigation"
                    aria-controls="primaryNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>

                <div class="collapse navbar-collapse hero__navigation" id="primaryNavigation">
                    <ul class="navbar-nav hero__links">
                        <li class="nav-item"><a class="nav-link" href="#selected-work">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="#studio">Studio</a></li>
                        <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                        <li class="nav-item"><a class="nav-link" href="#journal">Journal</a></li>
                    </ul>

                    <a class="hero__project-link" href="mailto:studio@zarqi.example">
                        <span>Start a project</span>
                        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </nav>

        <div class="hero__content">
            <div class="hero__heading">
                <p class="hero__eyebrow">Architecture <span aria-hidden="true">·</span> Interiors <span aria-hidden="true">·</span> Objects</p>
                <h1>Space, sculpted<br>into stillness.</h1>
            </div>

            <p class="hero__intro">
                We create enduring places where light, material and<br class="d-none d-md-block">
                landscape become one quiet, precise experience.
            </p>

            <div class="hero__actions">
                <a class="hero__cta" href="#selected-work">
                    <span>Explore work</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </a>
                <button class="hero__play" type="button" aria-label="Play studio film" aria-pressed="false">
                    <i class="fa-solid fa-play" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="selected-work" aria-label="Selected work"></main>

    <script src="assets/vendor/jquery/jquery-4.0.0.min.js"></script>
    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
